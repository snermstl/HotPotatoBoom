<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Potato — Bomb Pass</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     A blast-radius palette: near-black charcoal base, a live-wire
     lime for "armed" state, a klaxon orange for rising danger,
     and a flat blood-red for detonation. Typography leans on
     heavy, condensed system faces — the kind stamped on ordnance
     crates — kept to a strict scale so the one dramatic gesture
     (the bomb, its fuse, the flash) is what people remember.
     ============================================================ */
  :root{
    --bg:            #090b10;
    --bg-alt:        #0f1320;
    --panel:         #141926;
    --panel-line:    #232a3d;
    --text:          #eef1f7;
    --muted:         #7c8698;
    --lime:          #c8ff3d;
    --lime-dim:      #7ea62a;
    --orange:        #ff7a1f;
    --red:           #ff2e4d;
    --red-deep:      #7a0a1c;
    --focus:         #6cd6ff;

    --font-display: "Archivo Black","Arial Black","Helvetica Neue",Impact,sans-serif;
    --font-body:    -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;
    --font-mono:    "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #1a2036 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  :focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
  }

  .app{
    position:relative;
    width:100%;
    max-width:520px;
  }

  /* ---------- Screen switcher ---------- */
  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:screen-in .45s ease both;
  }
  .screen.active{ display:flex; }
  @keyframes screen-in{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============================================================
     IDLE SCREEN
     ============================================================ */
  .eyebrow{
    font-family:var(--font-mono);
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--lime);
    margin:0 0 10px;
  }

  .logo{
    font-family:var(--font-display);
    font-size:clamp(38px,9vw,58px);
    line-height:.92;
    margin:0 0 6px;
    letter-spacing:-.01em;
    text-transform:uppercase;
  }
  .logo .accent{ color:var(--lime); }

  .tagline{
    color:var(--muted);
    font-size:15px;
    max-width:38ch;
    margin:0 0 32px;
    line-height:1.5;
  }

  .settings-panel{
    width:100%;
    background:linear-gradient(180deg,var(--panel),var(--bg-alt));
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:22px 22px 8px;
    margin-bottom:28px;
    text-align:left;
  }

  .settings-title{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .settings-title::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 8px var(--lime);
  }
  .settings-title.second{ margin-top:4px; }
