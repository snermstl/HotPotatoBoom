<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Potato — Bomb Pass</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     A blast-radius palette: near-black charcoal base, a live-wire
     lime for "armed" state, a klaxon orange for rising danger,
     and a flat blood-red for detonation. Typography leans on
     heavy, condensed system faces — the kind stamped on ordnance
     crates — kept to a strict scale so the one dramatic gesture
     (the bomb, its fuse, the flash) is what people remember.
     ============================================================ */
  :root{
    --bg:            #090b10;
    --bg-alt:        #0f1320;
    --panel:         #141926;
    --panel-line:    #232a3d;
    --text:          #eef1f7;
    --muted:         #7c8698;
    --lime:          #c8ff3d;
    --lime-dim:      #7ea62a;
    --orange:        #ff7a1f;
    --red:           #ff2e4d;
    --red-deep:      #7a0a1c;
    --focus:         #6cd6ff;

    --font-display: "Archivo Black","Arial Black","Helvetica Neue",Impact,sans-serif;
    --font-body:    -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;
    --font-mono:    "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #1a2036 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  :focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
  }

  .app{
    position:relative;
    width:100%;
    max-width:520px;
  }

  /* ---------- Screen switcher ---------- */
  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:screen-in .45s ease both;
  }
  .screen.active{ display:flex; }
  @keyframes screen-in{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============================================================
     IDLE SCREEN
     ============================================================ */
  .eyebrow{
    font-family:var(--font-mono);
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--lime);
    margin:0 0 10px;
  }

  .logo{
    font-family:var(--font-display);
    font-size:clamp(38px,9vw,58px);
    line-height:.92;
    margin:0 0 6px;
    letter-spacing:-.01em;
    text-transform:uppercase;
  }
  .logo .accent{ color:var(--lime); }

  .tagline{
    color:var(--muted);
    font-size:15px;
    max-width:38ch;
    margin:0 0 32px;
    line-height:1.5;
  }

  .settings-panel{
    width:100%;
    background:linear-gradient(180deg,var(--panel),var(--bg-alt));
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:22px 22px 8px;
    margin-bottom:28px;
    text-align:left;
  }

  .settings-title{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .settings-title::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 8px var(--lime);
  }
  .settings-title.second{ margin-top:4px; }

  .field-row{
    display:flex;
    gap:14px;
    margin-bottom:18px;
  }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .field label .unit{ color:var(--panel-line); }

  .field input[type="number"]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:10px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:18px;
    padding:10px 12px;
    transition:border-color .15s ease;
  }
  .field input[type="number"]:focus{
    border-color:var(--lime);
  }
  .field input[type=number]::-webkit-inner-spin-button{ opacity:.4; }

  .field select,
  .field textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:10px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    padding:10px 12px;
    transition:border-color .15s ease;
  }
  .field select:focus,
  .field textarea:focus{
    border-color:var(--lime);
  }
  .field textarea{
    min-height:96px;
    resize:vertical;
  }

  .status-panel{
    margin:8px 0 16px;
    padding:12px 12px 10px;
    border:1px solid var(--panel-line);
    border-radius:12px;
    background:rgba(255,255,255,.03);
  }
  .status-title{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .status-line{
    font-size:13px;
    line-height:1.5;
    color:var(--text);
  }
  .player-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    padding:6px 9px;
    border-radius:999px;
    font-size:12px;
    background:rgba(255,255,255,.06);
    color:var(--muted);
    border:1px solid rgba(255,255,255,.08);
  }
  .pill.active{ color:var(--lime); border-color:rgba(200,255,61,.25); }
  .pill.out{ color:var(--red); border-color:rgba(255,46,77,.25); }

  button, input, select, textarea{
    touch-action:manipulation;
  }
  button{ min-height:48px; }

  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 2px;
    border-top:1px solid var(--panel-line);
  }
  .switch-row .switch-copy{ text-align:left; }
  .switch-row .switch-copy .title{ font-size:14px; font-weight:600; }
  .switch-row .switch-copy .desc{ font-size:12px; color:var(--muted); margin-top:2px; }

  .switch{
    position:relative;
    width:46px;
    height:26px;
    flex:none;
  }
  .switch input{
    position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;
  }
  .switch .track{
    position:absolute; inset:0;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:999px;
    transition:background .2s ease, border-color .2s ease;
  }
  .switch .thumb{
    position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:50%;
    background:var(--muted);
    transition:transform .2s ease, background .2s ease;
  }
  .switch input:checked + .track{ background:rgba(200,255,61,.12); border-color:var(--lime-dim); }
  .switch input:checked + .track .thumb{ transform:translateX(20px); background:var(--lime); }

  .volume-row{
    padding:14px 2px 18px;
    border-top:1px solid var(--panel-line);
    text-align:left;
  }
  .volume-row label{
    font-size:12px; color:var(--muted);
    display:flex; justify-content:space-between; margin-bottom:10px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:999px;
    background:var(--panel-line);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 0 4px rgba(200,255,61,.15);
   .cursor:pointer;
  }
