<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Potato — Bomb Pass</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     A blast-radius palette: near-black charcoal base, a live-wire
     lime for "armed" state, a klaxon orange for rising danger,
     and a flat blood-red for detonation. Typography leans on
     heavy, condensed system faces — the kind stamped on ordnance
     crates — kept to a strict scale so the one dramatic gesture
     (the bomb, its fuse, the flash) is what people remember.
     ============================================================ */
  :root{
    --bg:            #090b10;
    --bg-alt:        #0f1320;
    --panel:         #141926;
    --panel-line:    #232a3d;
    --text:          #eef1f7;
    --muted:         #7c8698;
    --lime:          #c8ff3d;
    --lime-dim:      #7ea62a;
    --orange:        #ff7a1f;
    --red:           #ff2e4d;
    --red-deep:      #7a0a1c;
    --focus:         #6cd6ff;

    --font-display: "Archivo Black","Arial Black","Helvetica Neue",Impact,sans-serif;
    --font-body:    -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;
    --font-mono:    "SFMono-Regular","Consolas","Liberation Mono",Menlo,monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #1a2036 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  :focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
  }

  .app{
    position:relative;
    width:100%;
    max-width:520px;
  }

  /* ---------- Screen switcher ---------- */
  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:screen-in .45s ease both;
  }
  .screen.active{ display:flex; }
  @keyframes screen-in{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============================================================
     IDLE SCREEN
     ============================================================ */
  .eyebrow{
    font-family:var(--font-mono);
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--lime);
    margin:0 0 10px;
  }

  .logo{
    font-family:var(--font-display);
    font-size:clamp(38px,9vw,58px);
    line-height:.92;
    margin:0 0 6px;
    letter-spacing:-.01em;
    text-transform:uppercase;
  }
  .logo .accent{ color:var(--lime); }

  .tagline{
    color:var(--muted);
    font-size:15px;
    max-width:38ch;
    margin:0 0 32px;
    line-height:1.5;
  }

  .settings-panel{
    width:100%;
    background:linear-gradient(180deg,var(--panel),var(--bg-alt));
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:22px 22px 8px;
    margin-bottom:28px;
    text-align:left;
  }

  .settings-title{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .settings-title::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 8px var(--lime);
  }
  .settings-title.second{ margin-top:4px; }

  .field-row{
    display:flex;
    gap:14px;
    margin-bottom:18px;
  }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .field label .unit{ color:var(--panel-line); }

  .field input[type="number"]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:10px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:18px;
    padding:10px 12px;
    transition:border-color .15s ease;
  }
  .field input[type="number"]:focus{
    border-color:var(--lime);
  }
  .field input[type=number]::-webkit-inner-spin-button{ opacity:.4; }

  .field select,
  .field textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:10px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    padding:10px 12px;
    transition:border-color .15s ease;
  }
  .field select:focus,
  .field textarea:focus{
    border-color:var(--lime);
  }
  .field textarea{
    min-height:96px;
    resize:vertical;
  }

  .status-panel{
    margin:8px 0 16px;
    padding:12px 12px 10px;
    border:1px solid var(--panel-line);
    border-radius:12px;
    background:rgba(255,255,255,.03);
  }
  .status-title{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .status-line{
    font-size:13px;
    line-height:1.5;
    color:var(--text);
  }
  .player-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    padding:6px 9px;
    border-radius:999px;
    font-size:12px;
    background:rgba(255,255,255,.06);
    color:var(--muted);
    border:1px solid rgba(255,255,255,.08);
  }
  .pill.active{ color:var(--lime); border-color:rgba(200,255,61,.25); }
  .pill.out{ color:var(--red); border-color:rgba(255,46,77,.25); }

  button, input, select, textarea{
    touch-action:manipulation;
  }
  button{ min-height:48px; }

  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 2px;
    border-top:1px solid var(--panel-line);
  }
  .switch-row .switch-copy{ text-align:left; }
  .switch-row .switch-copy .title{ font-size:14px; font-weight:600; }
  .switch-row .switch-copy .desc{ font-size:12px; color:var(--muted); margin-top:2px; }

  .switch{
    position:relative;
    width:46px;
    height:26px;
    flex:none;
  }
  .switch input{
    position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;
  }
  .switch .track{
    position:absolute; inset:0;
    background:var(--bg);
    border:1px solid var(--panel-line);
    border-radius:999px;
    transition:background .2s ease, border-color .2s ease;
  }
  .switch .thumb{
    position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:50%;
    background:var(--muted);
    transition:transform .2s ease, background .2s ease;
  }
  .switch input:checked + .track{ background:rgba(200,255,61,.12); border-color:var(--lime-dim); }
  .switch input:checked + .track .thumb{ transform:translateX(20px); background:var(--lime); }

  .volume-row{
    padding:14px 2px 18px;
    border-top:1px solid var(--panel-line);
    text-align:left;
  }
  .volume-row label{
    font-size:12px; color:var(--muted);
    display:flex; justify-content:space-between; margin-bottom:10px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:999px;
    background:var(--panel-line);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 0 4px rgba(200,255,61,.15);
    cursor:pointer;
    margin-top:-7px;
  }
  input[type="range"]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; border:none;
    background:var(--lime);
    box-shadow:0 0 0 4px rgba(200,255,61,.15);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-track{
    height:6px; border-radius:999px; background:var(--panel-line);
  }

  /* Slider meta display */
  .field-row .unit span{ color:var(--muted); font-family:var(--font-mono); }

  .demo-timeline{
    height:36px;
    border-radius:8px;
    background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid var(--panel-line);
    position:relative;
    overflow:hidden;
    margin-top:8px;
  }
  .demo-interval{
    position:absolute;
    bottom:0;
    height:100%;
    background:linear-gradient(180deg,var(--lime),var(--lime-dim));
    opacity:0.95;
    border-left:1px solid rgba(0,0,0,0.08);
    cursor:default;
  }
  .demo-interval::after{
    content:attr(data-tip);
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    background:rgba(10,10,10,0.95);
    color:var(--text);
    padding:6px 8px;
    border-radius:6px;
    font-size:12px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
  }
  .demo-interval:hover::after{ opacity:1; }

  .snackbar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    background:rgba(10,10,10,0.95);
    color:var(--text);
    padding:10px 14px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .2s ease;
    z-index:60;
  }
  .snackbar.visible{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(-4px); }
  }

  .field-error{
    color:var(--red);
    font-size:12px;
    font-family:var(--font-mono);
    min-height:16px;
    margin:-8px 0 14px;
    text-align:left;
  }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:var(--font-display);
    letter-spacing:.03em;
    text-transform:uppercase;
    border-radius:14px;
    padding:20px 32px;
    width:100%;
    font-size:20px;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:active{ transform:scale(.97); }

  .btn-start{
    background:linear-gradient(180deg,var(--lime),var(--lime-dim));
    color:#0a1400;
    box-shadow:0 0 0 1px rgba(200,255,61,.3), 0 12px 30px -10px rgba(200,255,61,.5);
  }
  .btn-start:hover{ filter:brightness(1.08); }

  .btn-stop{
    background:transparent;
    color:var(--text);
    border:2px solid var(--panel-line);
  }
  .btn-stop:hover{ border-color:var(--red); color:var(--red); }

  .btn-again{
    background:linear-gradient(180deg,var(--orange),#b8390a);
    color:#1a0800;
    box-shadow:0 12px 30px -10px rgba(255,122,31,.55);
  }
  .btn-again:hover{ filter:brightness(1.08); }

  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:2px solid var(--panel-line);
    margin-top:12px;
    font-size:14px;
    padding:14px 24px;
  }
  .btn-ghost:hover{ border-color:var(--red); color:var(--red); }

  /* ============================================================
     PLAYING SCREEN
     ============================================================ */
  .round-indicator{
    font-family:var(--font-mono);
    letter-spacing:.3em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .round-indicator span{ color:var(--lime); font-weight:700; }

  .bomb-stage{
    position:relative;
    width:min(70vw,280px);
    height:min(70vw,280px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  .pulse-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--lime);
    opacity:0;
  }
  .pulse-ring.fire{
    animation:pulse-ring-anim var(--pulse-dur,.5s) ease-out;
  }
  @keyframes pulse-ring-anim{
    0%{ transform:scale(.55); opacity:.9; border-color:var(--lime); }
    100%{ transform:scale(1.15); opacity:0; border-color:var(--red); }
  }

  #bomb-svg{ width:100%; height:100%; overflow:visible; }
  .bomb-shake.fire{ animation:bomb-shake var(--pulse-dur,.5s) ease-out; }
  @keyframes bomb-shake{
    0%{ transform:translate(0,0) rotate(0); }
    25%{ transform:translate(-2px,1px) rotate(-1deg); }
    50%{ transform:translate(2px,-1px) rotate(1deg); }
    75%{ transform:translate(-1px,-1px) rotate(-.5deg); }
    100%{ transform:translate(0,0) rotate(0); }
  }

  .timer-readout{
    font-family:var(--font-mono);
    font-size:14px;
    color:var(--muted);
    min-height:20px;
    margin-bottom:26px;
    letter-spacing:.05em;
  }
  .timer-readout.blind{ visibility:hidden; }

  /* ============================================================
     EXPLOSION SCREEN
     ============================================================ */
  #screen-explosion{ padding-top:10px; }
  .boom-text{
    font-family:var(--font-display);
    font-size:clamp(56px,16vw,96px);
    line-height:.9;
    color:var(--red);
    text-shadow:
      0 0 20px rgba(255,46,77,.75),
      0 0 60px rgba(255,122,31,.45);
    margin:10px 0 6px;
    animation:boom-pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  .boom-text .emoji{ display:inline-block; margin-left:8px; }
  @keyframes boom-pop{
    0%{ transform:scale(.2) rotate(-6deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }
  .boom-sub{
    color:var(--muted);
    font-size:15px;
    margin:0 0 26px;
  }
  .boom-sub strong{ color:var(--text); }

  /* Full-viewport detonation flash */
  #flash-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 45%, #fff 0%, var(--orange) 22%, var(--red) 48%, transparent 78%);
    opacity:0;
    z-index:50;
  }
  #flash-overlay.fire{
    animation:screen-flash .9s cubic-bezier(.15,.8,.3,1) both;
  }
  @keyframes screen-flash{
    0%{ opacity:0; }
    6%{ opacity:1; }
    100%{ opacity:0; }
  }
  body.exploded{
    animation:body-rumble .6s ease-in-out 1;
  }
  @keyframes body-rumble{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,3px); }
    40%{ transform:translate(5px,-4px); }
    60%{ transform:translate(-4px,-2px); }
    80%{ transform:translate(3px,4px); }
  }

  /* ============================================================
     COUNTDOWN SCREEN (auto mode, between rounds)
     ============================================================ */
  .countdown-label{
    font-family:var(--font-mono);
    letter-spacing:.25em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .countdown-label strong{ color:var(--lime); }
  .countdown-number{
    font-family:var(--font-display);
    font-size:clamp(80px,26vw,140px);
    line-height:1;
    color:var(--lime);
    text-shadow:0 0 40px rgba(200,255,61,.45);
    margin:6px 0 28px;
    animation:count-pop .35s ease both;
  }
  @keyframes count-pop{
    from{ transform:scale(.7); opacity:.3; }
    to{ transform:scale(1); opacity:1; }
  }

  /* ============================================================
     GAME COMPLETE SCREEN
     ============================================================ */
  .complete-title{
    font-family:var(--font-display);
    font-size:clamp(34px,8vw,46px);
    color:var(--lime);
    margin:14px 0 8px;
    text-transform:uppercase;
  }

  footer.hint{
    margin-top:30px;
    font-size:11px;
    color:var(--panel-line);
    font-family:var(--font-mono);
    letter-spacing:.08em;
  }

  @media (max-width: 640px){
    body{ padding:14px; align-items:flex-start; }
    .app{ max-width:100%; }
    .settings-panel{ padding:18px 16px 8px; border-radius:14px; }
    .tagline{ font-size:14px; margin-bottom:24px; }
    .field-row{ flex-direction:column; gap:10px; margin-bottom:10px; }
    .field{ width:100%; }
    .btn{ padding:18px 26px; font-size:18px; border-radius:12px; min-height:56px; }
    .btn-ghost{ padding:12px 20px; font-size:13px; }
    .bomb-stage{ width:min(78vw,220px); height:min(78vw,220px); margin-bottom:18px; }
    .switch-row{ padding:12px 2px; }
  }

  @media (max-width: 420px){
    body{ padding:10px; }
    .logo{ font-size:clamp(32px,11vw,42px); }
    .settings-panel{ padding:16px 14px 8px; }
    .btn{ font-size:16px; padding:14px 18px; min-height:52px; }
    .boom-text{ font-size:clamp(44px,18vw,72px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
